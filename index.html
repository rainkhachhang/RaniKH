<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RANI - Hối Hàng</title>

<link href="https://googleapis.com" rel="stylesheet">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(135deg, #4CAF50, #2e7d32);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  padding: 20px;
  overflow-x: hidden;
}

/* HIỆU ỨNG CHỮ CHẠY */
.header { text-align: center; width: 100%; overflow: hidden; }
.logo {
  font-family: 'Black Ops One', cursive;
  font-size: 60px;
  margin: 0;
  animation: slideLeft 1.2s ease-out forwards;
}
.slogan {
  font-size: 15px;
  margin-top: 5px;
  font-weight: 600;
  animation: slideRight 1.2s ease-out forwards;
}

@keyframes slideLeft { 0% { transform: translateX(-100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
@keyframes slideRight { 0% { transform: translateX(100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }

/* THẺ FORM */
.card {
  margin-top: 25px;
  width: 100%;
  max-width: 400px;
  background: #ffffff;
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  color: #333;
}

input, textarea {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 16px;
  font-family: 'Montserrat', sans-serif;
  background: #f9f9f9;
}

/* NÚT BẤM ĐA HIỆU ỨNG */
.btn-submit {
  width: 100%;
  padding: 16px;
  background: linear-gradient(45deg, #ff5722, #ff9800, #ff5722);
  background-size: 200% auto;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
  transition: 0.3s;
  margin-top: 10px;
}

.btn-submit:active { transform: scale(0.95); }

/* Rung khi lỗi hoặc khi nhấn */
.shake { animation: shake 0.4s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

#status { 
  text-align: center; 
  margin-top: 15px; 
  font-size: 14px; 
  font-weight: 600;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">RANI</div>
  <div class="slogan">Tận Tâm - Phục Vụ</div>
</div>

<div class="card">
  <input id="name" placeholder="Tên cửa hàng / Khách hàng">
  <input id="phone" type="tel" placeholder="Số điện thoại (Bắt buộc)">
  <textarea id="note" placeholder="Ghi chú thêm..."></textarea>

  <p style="font-size:12px; text-align:center; color: #888; margin-bottom: 10px;">
    📍 Vui lòng cho phép truy cập vị trí để gửi tin
  </p>

  <button id="mainBtn" class="btn-submit" onclick="handleSubmit()">HỐI HÀNG NGAY</button>

  <div id="status"></div>
</div>

<script>
function handleSubmit() {
  const btn = document.getElementById("mainBtn");
  const status = document.getElementById("status");
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const note = document.getElementById("note").value;

  // Hiệu ứng rung
  btn.classList.add('shake');
  setTimeout(() => btn.classList.remove('shake'), 400);

  if (phone.trim() === "") {
    status.innerHTML = "⚠️ Vui lòng nhập số điện thoại!";
    status.style.color = "red";
    return;
  }

  status.innerHTML = "🔄 Đang lấy vị trí GPS...";
  status.style.color = "blue";

  // Lấy vị trí GPS
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      status.innerHTML = "📡 Đang gửi dữ liệu...";
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      // --- THAY LINK CỦA BẠN VÀO DÒNG DƯỚI ĐÂY ---
      const scriptURL = "https://script.google.com/macros/s/AKfycbwPiCZcfjdZ5hfc6WfNUq00C0nW7PIkf6vTeMHK3RK1qUqYymNdqWVR-VYT_W1rpUld/exec";
      
      const finalURL = scriptURL 
        + "?name=" + encodeURIComponent(name)
        + "&phone=" + encodeURIComponent(phone)
        + "&note=" + encodeURIComponent(note)
        + "&lat=" + lat
        + "&lng=" + lng;

      fetch(finalURL, { mode: 'no-cors' })
        .then(() => {
          status.innerHTML = "✅ Gửi thành công! <br> RANI đã nhận được thông tin.";
          status.style.color = "green";
          btn.style.background = "#4CAF50";
          btn.innerText = "ĐÃ GỬI XONG";
          
          // Xóa trắng form
          document.getElementById("name").value = "";
          document.getElementById("phone").value = "";
          document.getElementById("note").value = "";
        })
        .catch(err => {
          status.innerHTML = "❌ Lỗi mạng: Không thể gửi đi.";
          status.style.color = "red";
        });
    },
    function(error) {
      let msg = "";
      if (error.code == 1) msg = "❌ Bạn cần 'Cho phép' vị trí trên điện thoại.";
      else if (error.code == 3) msg = "❌ Hết thời gian lấy vị trí. Thử lại nhé!";
      else msg = "❌ Lỗi GPS. Vui lòng bật vị trí.";
      
      status.innerHTML = msg;
      status.style.color = "red";
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}
</script>

</body>
</html>
