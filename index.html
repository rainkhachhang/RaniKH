<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RANI - Hối Hàng</title>
<link href="https://googleapis.com" rel="stylesheet">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; font-family: 'Montserrat', sans-serif;
  background: linear-gradient(135deg, #4CAF50, #2e7d32);
  min-height: 100vh; display: flex; flex-direction: column;
  /* Đẩy nội dung lên cao hơn */
  justify-content: flex-start; align-items: center; color: white; padding: 20px; overflow-x: hidden;
}

/* HEADER */
.header { text-align: center; width: 100%; overflow: hidden; margin-top: 20px; } /* Thêm lề trên ít để không sát mép */
.logo { font-family: 'Black Ops One', cursive; font-size: 60px; margin: 0; animation: slideLeft 1s ease-out forwards; }
.slogan { font-size: 15px; margin-top: 5px; font-weight: 600; animation: slideRight 1s ease-out forwards; }

@keyframes slideLeft { 0% { transform: translateX(-100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
@keyframes slideRight { 0% { transform: translateX(100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }

/* FORM CARD */
.card {
  margin-top: 15px; /* Giảm khoảng cách để đẩy form lên cao */
  width: 100%; max-width: 400px;
  background: #ffffff; border-radius: 25px; padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: #333;
}
input, textarea {
  width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
  border: 1px solid #ddd; font-size: 16px; background: #f9f9f9;
}

/* BUTTONS */
.btn-submit {
  width: 100%; padding: 16px; background: linear-gradient(45deg, #ff5722, #ff9800);
  color: white; border: none; border-radius: 14px;
  font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px;
}
.btn-call {
  width: 100%; padding: 16px; background: linear-gradient(45deg, #2196F3, #00BCD4);
  color: white; border: none; border-radius: 14px;
  font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px;
}
.shake { animation: shake 0.4s ease-in-out; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* LOADING & SUCCESS OVERLAY */
#loadingOverlay, #successOverlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column;
  justify-content: center; align-items: center; text-align: center; padding: 20px;
}
.loader {
  border: 6px solid #f3f3f3; border-top: 6px solid #ff5722;
  border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* SUCCESS ICON */
.success-icon { font-size: 80px; color: #4CAF50; margin-bottom: 20px; }
.success-title { font-size: 24px; font-weight: bold; color: white; margin-bottom: 10px; }
.success-msg { font-size: 18px; color: #ddd; line-height: 1.5; }

#status { text-align: center; margin-top: 15px; font-size: 14px; font-weight: 600; }
#guideBox { display: none; background: #fff3f3; border: 2px solid #ff4444; border-radius: 15px; padding: 15px; margin-top: 15px; }
</style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay">
  <div class="loader"></div>
  <p style="color: white; margin-top: 15px; font-weight: bold;">ĐANG GỬI THÔNG TIN...<br><small>Vui lòng chờ giây lát</small></p>
</div>

<!-- Success Overlay -->
<div id="successOverlay" onclick="location.reload()">
  <div class="success-icon">✅</div>
  <div class="success-title">GỬI THÀNH CÔNG!</div>
  <div class="success-msg">RANI đã nhận được thông tin hối hàng.<br>Chúng tôi sẽ xử lý và liên hệ lại ngay.<br><br><b>Cảm ơn quý khách đã tin tưởng!</b></div>
  <button class="btn-submit" style="max-width: 200px; margin-top: 30px;">ĐÓNG</button>
</div>

<div class="header">
  <div class="logo">RANI</div>
  <div class="slogan">Tận Tâm - Phục Vụ</div>
</div>

<div class="card">
  <input id="name" placeholder="Tên cửa hàng / Khách hàng">
  <input id="phone" type="tel" placeholder="Số điện thoại (Bắt buộc)">
  <textarea id="note" placeholder="Ghi chú thêm..."></textarea>
  
  <button id="mainBtn" class="btn-submit" onclick="handleSubmit('gps')">HỐI HÀNG (CẦN VỊ TRÍ)</button>
  <button id="callBtn" class="btn-call" onclick="handleSubmit('call')">YÊU CẦU GỌI LẠI</button>
  
  <div id="status"></div>

  <div id="guideBox">
    <b style="color: #d32f2f;">⚠️ BẠN CHƯA BẬT VỊ TRÍ</b><br>
    <p id="guideText">Bấm nút "YÊU CẦU GỌI LẠI" bên trên nếu bạn không biết bật định vị.</p>
  </div>
</div>

<script>
// LINK GOOGLE SCRIPT CỦA BẠN
const scriptURL = "https://script.google.com/macros/s/AKfycbzADAsvUK5sGGSeMWTNZM-QLJpk77pmDH887-tUw_kGJkcQyEQEwKdws1wAccAV3NT_/exec";

function validatePhone(phone) {
  const re = /^(0)[0-9]{9}$/;
  return re.test(phone);
}

function handleSubmit(type) {
  const status = document.getElementById("status");
  const loader = document.getElementById("loadingOverlay");
  const guideBox = document.getElementById("guideBox");
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const note = document.getElementById("note").value;

  if (!validatePhone(phone)) {
    status.innerHTML = "⚠️ Số điện thoại không đúng (10 số)!";
    status.style.color = "red";
    document.getElementById("phone").classList.add('shake');
    setTimeout(() => document.getElementById("phone").classList.remove('shake'), 400);
    return;
  }

  guideBox.style.display = "none";
  status.innerHTML = "";
  loader.style.display = "flex";

  if (type === 'call') {
    sendData(name, phone, note + " [KH YÊU CẦU GỌI LẠI]", "", "");
  } else {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        sendData(name, phone, note, pos.coords.latitude, pos.coords.longitude);
      },
      function(error) {
        loader.style.display = "none";
        guideBox.style.display = "block";
        status.innerHTML = "❌ Lỗi vị trí.";
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
}

function sendData(name, phone, note, lat, lng) {
  const loader = document.getElementById("loadingOverlay");
  const successOverlay = document.getElementById("successOverlay");

  const finalURL = scriptURL 
    + "?name=" + encodeURIComponent(name)
    + "&phone=" + encodeURIComponent(phone)
    + "&note=" + encodeURIComponent(note)
    + "&lat=" + lat
    + "&lng=" + lng;

  fetch(finalURL, { mode: 'no-cors' })
    .then(() => {
      loader.style.display = "none";
      successOverlay.style.display = "flex"; // Hiện thông báo cảm ơn
      
      // Reset form
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("note").value = "";
    })
    .catch(err => {
      loader.style.display = "none";
      alert("Lỗi kết nối, vui lòng thử lại!");
    });
}
</script>
</body>
</html>
